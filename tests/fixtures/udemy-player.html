<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Udemy subtitle component fixture</title>
  <link rel="stylesheet" href="/dist/udemy-subtitle-styler/src/content.css">
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #202020;
    }

    #fullscreen-surface {
      width: 900px;
      height: 520px;
      padding: 20px;
      background: #101010;
    }

    #fullscreen-surface:fullscreen {
      width: 100vw;
      height: 100vh;
      padding: 0;
      background: #000;
    }

    [data-purpose="video-player"] {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #080808;
    }

    #caption-source {
      position: absolute;
      left: 50%;
      bottom: 72px;
      z-index: 3;
      transform: translateX(-50%);
      color: white;
      text-align: center;
    }
  </style>
</head>
<body>
  <button id="enter-fullscreen" type="button">Enter fixture fullscreen</button>
  <button id="exit-fullscreen" type="button">Exit fixture fullscreen</button>
  <button id="disable-styler" type="button">Disable styler</button>
  <button id="enable-styler" type="button">Enable styler</button>
  <button id="chinese-above" type="button">Chinese above</button>
  <button id="chinese-below" type="button">Chinese below</button>
  <div id="fullscreen-surface" data-purpose="video-player-fullscreen-container">
    <div id="udemy-player" data-purpose="video-player">
      <video id="lesson-video" aria-label="Course video"></video>
      <div id="caption-source" class="captions-display immersive-translate-target-wrapper">
        <span class="immersive-translate-target-inner">English original subtitle</span>
        <span class="immersive-translate-target-translation-block-wrapper">中文字幕翻译</span>
      </div>
    </div>
  </div>

  <script>
    window.fixtureSettings = {
      enabled: true,
      subtitleOrder: "en-first",
      subtitleGap: "11",
      containerBackgroundColor: "#123456",
      containerBackgroundOpacity: "75",
      englishColor: "#fedcba",
      englishWeight: "600",
      englishFontFamily: "Arial",
      englishFontSize: "27",
      englishBackgroundColor: "#112233",
      englishBackgroundOpacity: "40",
      englishStrokeColor: "#ff0000",
      englishStrokeWidth: "5",
      englishStrokeOpacity: "50",
      chineseColor: "#00ff00",
      chineseWeight: "800",
      chineseFontFamily: "serif",
      chineseFontSize: "31",
      chineseBackgroundColor: "#445566",
      chineseBackgroundOpacity: "60",
      chineseStrokeColor: "#0000ff",
      chineseStrokeWidth: "4",
      chineseStrokeOpacity: "70"
    };

    window.chrome = {
      storage: {
        sync: {
          get(defaults, callback) {
            const settingsKey = Object.keys(defaults)[0];
            callback({
              [settingsKey]: {
                ...defaults[settingsKey],
                ...window.fixtureSettings
              }
            });
          }
        },
        onChanged: {
          addListener() {}
        }
      },
      runtime: {
        onMessage: {
          addListener() {}
        }
      }
    };

    let simulatedFullscreenElement = null;

    Object.defineProperty(document, "webkitFullscreenElement", {
      configurable: true,
      get() {
        return simulatedFullscreenElement;
      }
    });

    function dispatchSimulatedFullscreenChange(element) {
      simulatedFullscreenElement = element;
      document.dispatchEvent(new Event("webkitfullscreenchange"));
    }

    document.getElementById("enter-fullscreen").addEventListener("click", () => {
      const surface = document.getElementById("fullscreen-surface");
      dispatchSimulatedFullscreenChange(surface);
    });

    document.getElementById("exit-fullscreen").addEventListener("click", () => {
      dispatchSimulatedFullscreenChange(null);
    });

    document.getElementById("disable-styler").addEventListener("click", () => {
      window.__femSubtitleStyler.setSettings({
        ...window.__femSubtitleStyler.getSettings(),
        enabled: false
      });
    });

    document.getElementById("enable-styler").addEventListener("click", () => {
      window.__femSubtitleStyler.setSettings({
        ...window.fixtureSettings,
        enabled: true
      });
    });

    document.getElementById("chinese-above").addEventListener("click", () => {
      window.__femSubtitleStyler.setSettings({
        ...window.__femSubtitleStyler.getSettings(),
        subtitleOrder: "zh-first"
      });
    });

    document.getElementById("chinese-below").addEventListener("click", () => {
      window.__femSubtitleStyler.setSettings({
        ...window.__femSubtitleStyler.getSettings(),
        subtitleOrder: "en-first"
      });
    });
  </script>
  <script src="/dist/udemy-subtitle-styler/src/plugin-config.js"></script>
  <script src="/dist/udemy-subtitle-styler/src/udemy-content.js"></script>
  <script src="/dist/udemy-subtitle-styler/src/subtitle-styler-core.js"></script>
</body>
</html>
